apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-dev
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/<your-org>/platform-gitops.git
    targetRevision: main
    path: apps/dev/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
